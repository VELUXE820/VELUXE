<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELUXE ADMIN</title>
<script>
const PIN="admin123";
if(sessionStorage.getItem('veluxe_ok')!=='yes'){
  let p=prompt("ADMIN PIN:");
  if(p!==PIN){alert("Wrong PIN!"); location.href="index.html";}
  else sessionStorage.setItem('veluxe_ok','yes');
}
</script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#f5f5f5;padding:20px} .box{background:#fff;padding:20px;border-radius:16px;max-width:500px;margin:20px auto} input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px} button{width:100%;height:45px;background:#000;color:#fff;border:0;border-radius:12px;font-weight:700;cursor:pointer}</style>
</head><body>
<div class="box">
<h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> VELUXE ADMIN</h2>
<p style="font-size:12px;color:#888;margin:10px 0">PIN: admin123 - Add products here</p>
<input id="name" placeholder="Product Name">
<input id="price" type="number" placeholder="Price">
<input id="old" type="number" placeholder="Old Price">
<input id="img" placeholder="Image URL">
<select id="cat"><option value="mens">MENS</option><option value="womens">WOMENS</option><option value="baby">BABY</option><option value="shoes">SHOES</option></select>
<input id="stock" type="number" placeholder="Stock">
<button onclick="addP()">ADD PRODUCT</button>
<hr style="margin:20px 0"><div id="list"></div>
<div style="margin-top:20px;display:flex;gap:10px"><a href="index.html" style="flex:1;text-align:center;padding:12px;background:#eee;border-radius:10px;text-decoration:none;color:#000">Back to Store</a><a href="#" onclick="sessionStorage.removeItem('veluxe_ok');location.href='index.html'" style="flex:1;text-align:center;padding:12px;background:#fee2e2;border-radius:10px;text-decoration:none;color:#991b1b">Logout</a></div>
</div>
<script>
let products=JSON.parse(localStorage.getItem("veluxe_custom_products")||"null")||[{id:100,name:"Womens Satin Dress Black",price:78,old:105,cat:"womens",stock:7,img:"https://images.unsplash.com/photo-1515372039744-b8f02a3c67ae?w=600",badge:"WOMENS"},{id:60,name:"Mens VELUXE Stripe Shirt REAL",price:68,old:90,cat:"mens",stock:15,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600",badge:"MENS REAL"},{id:52,name:"Baby Onesie Cream Bear",price:25,old:35,cat:"baby",stock:30,img:"https://images.unsplash.com/photo-1522771930-78848d9293e8?w=600",badge:"BABY"}];
function render(){document.getElementById('list').innerHTML=products.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee"><span style="font-size:12px">${p.name} - $${p.price}</span><button onclick="products.splice(${i},1);save();render()" style="width:auto;padding:6px 12px;background:#ff3b30">Del</button></div>`).join("")}
function save(){localStorage.setItem("veluxe_custom_products",JSON.stringify(products))}
function addP(){const n=document.getElementById('name').value, pr=Number(document.getElementById('price').value), old=Number(document.getElementById('old').value)||pr+20, im=document.getElementById('img').value, c=document.getElementById('cat').value, st=Number(document.getElementById('stock').value)||10; if(!n||!pr) return alert("Enter name & price"); products.unshift({id:Date.now(),name:n,price:pr,old:old,cat:c,stock:st,img:im||"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600",badge:c.toUpperCase()}); save(); render(); alert("Added!");}
render();
</script>
</body></html>
