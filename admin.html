<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELUXE ADMIN - Stock Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Space Grotesk',sans-serif;background:#fafafa;padding:20px}
.box{max-width:600px;margin:0 auto;background:#fff;border:1px solid #eaeaea;border-radius:20px;padding:24px}
h1{font-size:22px;letter-spacing:3px;margin-bottom:20px;text-align:center}
input,select{width:100%;padding:14px;border:1px solid #eaeaea;border-radius:12px;margin-bottom:10px;font-size:14px;outline:none}
label{font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:4px;display:block;margin-top:8px}
.btn{width:100%;height:54px;background:#000;color:#fff;border:0;border-radius:14px;font-weight:800;letter-spacing:2px;cursor:pointer;margin-top:10px}
.btn2{width:100%;height:44px;background:#fff;border:1px solid #000;border-radius:14px;font-weight:700;margin-top:10px;cursor:pointer}
.prod-list{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.p-item{display:flex;gap:10px;border:1px solid #eaeaea;padding:10px;border-radius:14px;align-items:center}
.p-img{width:60px;height:60px;background:#f5f5f5;border-radius:10px;overflow:hidden;flex-shrink:0}.p-img img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="box">
<h1>VELUXE ADMIN - STOCK 🔥</h1>
<label>Product Name</label>
<input id="pName" placeholder="e.g Womens Satin Dress Black">
<label>Category</label>
<select id="pCat">
<option value="womens">WOMENS 👩</option>
<option value="mens">MENS 👨</option>
<option value="baby">BABY 👶</option>
<option value="shoes">SHOES</option>
<option value="tees">TEES</option>
</select>
<label>Price ($)</label>
<input id="pPrice" type="number" placeholder="e.g 78">
<label>Old Price ($)</label>
<input id="pOld" type="number" placeholder="e.g 105">
<label>Stock Amount - IMPORTANT</label>
<input id="pStock" type="number" placeholder="e.g 10 - how many available">
<label>Image URL</label>
<input id="pImg" placeholder="https://... or inspiration.jpg">
<label>Badge Text</label>
<input id="pBadge" placeholder="e.g WOMENS NEW or LOW STOCK!">
<button class="btn" onclick="saveProduct()">SAVE PRODUCT WITH STOCK</button>
<button class="btn2" onclick="location.href='index.html'">← BACK TO STORE</button>
<button class="btn2" style="border-color:red;color:red" onclick="clearAll()">CLEAR ALL CUSTOM PRODUCTS</button>
<div style="margin-top:10px;font-size:10px;color:#888;text-align:center">After save, go to store and run: javascript:localStorage.removeItem('veluxe_custom_products') if you want to see default products again. But for your custom, it will show instantly.</div>
<div id="list" class="prod-list"></div>
</div>
<script>
let products=JSON.parse(localStorage.getItem("veluxe_custom_products")||"null")||[
{id:100,name:"Womens Satin Dress Black",price:78,old:105,cat:"womens",stock:7,img:"https://images.unsplash.com/photo-1515372039744-b8f02a3c67ae?w=600",badge:"WOMENS 👩"},
{id:60,name:"Mens VELUXE Stripe Shirt REAL",price:68,old:90,cat:"mens",stock:15,img:"inspiration.jpg",badge:"MENS REAL 🔥"},
{id:52,name:"Baby Onesie Cream Bear",price:25,old:35,cat:"baby",stock:30,img:"https://images.unsplash.com/photo-1522771930-78848d9293e8?w=600",badge:"BABY 👶"}
];
function saveProduct(){
const name=document.getElementById('pName').value.trim();
const cat=document.getElementById('pCat').value;
const price=parseInt(document.getElementById('pPrice').value);
const oldP=parseInt(document.getElementById('pOld').value)||price+20;
const stock=parseInt(document.getElementById('pStock').value)||10;
const img=document.getElementById('pImg').value.trim()||"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600";
const badge=document.getElementById('pBadge').value.trim()||cat.toUpperCase();
if(!name||!price)return alert("Put name and price!");
const newP={id:Date.now(),name,cat,price,old:oldP,stock,img,badge};
products.unshift(newP);
localStorage.setItem("veluxe_custom_products",JSON.stringify(products));
document.getElementById('pName').value="";document.getElementById('pPrice').value="";document.getElementById('pOld').value="";document.getElementById('pStock').value="";document.getElementById('pImg').value="";document.getElementById('pBadge').value="";
renderList();
alert(`Saved! ${name} with ${stock} in stock ✅`);
}
function renderList(){
document.getElementById('list').innerHTML=products.map((p,i)=>`<div class="p-item"><div class="p-img"><img src="${p.img}"></div><div style="flex:1"><div style="font-size:11px;font-weight:700">${p.name}</div><div style="font-size:10px;color:#888">${p.cat} • $${p.price} • Stock: ${p.stock||0} • ${p.badge}</div></div><button onclick="deleteProd(${i})" style="background:#000;color:#fff;border:0;padding:6px 12px;border-radius:8px;font-size:10px;cursor:pointer">DELETE</button></div>`).join("");
}
function deleteProd(i){if(!confirm("Delete?"))return;products.splice(i,1);localStorage.setItem("veluxe_custom_products",JSON.stringify(products));renderList()}
function clearAll(){if(!confirm("Clear all custom and return to default?"))return;localStorage.removeItem("veluxe_custom_products");location.reload()}
renderList();
</script>
</body>
</html>
