<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELUXE - Luxury Streetwear</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:#fff;color:#0a0a0a}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #eaeaea;display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.logo{font-size:24px;font-weight:700;letter-spacing:4px}
.icon-btn{width:40px;height:40px;border:1px solid #eaeaea;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;cursor:pointer}
.cart-count{position:absolute;top:-5px;right:-5px;background:#000;color:#fff;font-size:10px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.hero{padding:32px 20px 10px}
.hero h1{font-size:44px;line-height:.9;letter-spacing:-1px}
.hero h1 em{font-style:normal;font-weight:400;letter-spacing:5px}
.hero p{color:#888;max-width:320px;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-top:12px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 20px;position:sticky;top:65px;background:#fff;z-index:10}
.filter{white-space:nowrap;padding:10px 18px;border:1px solid #eaeaea;border-radius:30px;background:#fff;font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer;text-transform:uppercase}
.filter.active{background:#000;color:#fff;border-color:#000}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 10px 100px}
.card{border:1px solid #eaeaea;border-radius:18px;overflow:hidden}
.card-img{aspect-ratio:1/1.2;background:#f6f6f6;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:#fff;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:1px}
.card-info{padding:12px}
.card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;line-height:1.3;height:28px;overflow:hidden}
.card-price{margin-top:6px;display:flex;gap:6px;align-items:center}
.price{font-weight:700;font-size:14px}.old{text-decoration:line-through;color:#888;font-size:11px}
.add{margin-top:12px;width:100%;height:38px;border:0;background:#000;color:#fff;border-radius:10px;font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.cart-drawer{position:fixed;inset:0;z-index:100;display:none}
.cart-drawer.show{display:block}
.cart-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.cart-box{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:380px;background:#fff;display:flex;flex-direction:column}
.cart-head{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eaeaea;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase}
.cart-items{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.c-item{display:flex;gap:12px;border:1px solid #eaeaea;padding:10px;border-radius:14px}
.c-img{width:70px;height:80px;background:#f6f6f6;border-radius:10px;overflow:hidden}
.c-img img{width:100%;height:100%;object-fit:cover}
.cart-foot{padding:18px;border-top:1px solid #eaeaea;background:#fafafa}
.row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;text-transform:uppercase}
.row.total{font-weight:700;font-size:16px;margin-top:10px}
.checkout{width:100%;height:52px;background:#000;color:#fff;border:0;border-radius:14px;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:12px;cursor:pointer}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:74px}}
</style>
</head>
<body>
<header><div class="logo">VELUXE</div><div class="icon-btn" onclick="toggleCart()">🛒<div id="cartCount" class="cart-count">0</div></div></header>
<div class="hero"><h1>VELUXE<br><em>COLLECTION</em></h1><p>40 Pieces — Worldwide shipping — Luxury essentials</p></div>
<div class="filters">
<div class="filter active" onclick="filterCat('all',this)">All 40</div>
<div class="filter" onclick="filterCat('tees',this)">Tees</div>
<div class="filter" onclick="filterCat('cargos',this)">Cargos</div>
<div class="filter" onclick="filterCat('hoodies',this)">Hoodies</div>
<div class="filter" onclick="filterCat('caps',this)">Caps</div>
<div class="filter" onclick="filterCat('jackets',this)">Jackets</div>
</div>
<div id="products" class="products"></div>
<div id="cartDrawer" class="cart-drawer" onclick="if(event.target.closest('.cart-box')==null)toggleCart()">
<div class="cart-bg"></div>
<div class="cart-box">
<div class="cart-head"><span>Cart</span><span onclick="toggleCart()" style="cursor:pointer">✕</span></div>
<div id="cartItems" class="cart-items"></div>
<div class="cart-foot">
<div class="row"><span>Subtotal</span><span id="subtotal">$0</span></div>
<div class="row"><span>Shipping</span><span>$15</span></div>
<div class="row total"><span>Total</span><span id="total">$15</span></div>
<button class="checkout" onclick="checkout()">Order via WhatsApp</button>
</div>
</div>
</div>
<script>
const productsData=[

{id:10,name:"Veluxe Wide-Leg Jeans",price:92,old:120,cat:"cargos",img:"https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500",badge:"TRENDING"},
{id:11,name:"Veluxe Zipped Hoodie - Cream",price:110,old:140,cat:"hoodies",img:"https://images.unsplash.com/photo-1620799139507-715043871dcf?w=500",badge:"LUXE"},
{id:12,name:"Veluxe Bucket Hat - Khaki",price:32,old:45,cat:"caps",img:"https://images.unsplash.com/photo-1532453288672-3a27e9be9efd?w=500",badge:""},
{id:13,name:"Veluxe Linen Shirt - Sand",price:65,old:85,cat:"tees",img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500",badge:"SUMMER"},
{id:14,name:"Veluxe Tactical Cargo - Olive",price:98,old:125,cat:"cargos",img:"https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?w=500",badge:"BESTSELLER"},
{id:15,name:"Veluxe Oversized Hoodie - Black",price:100,old:130,cat:"hoodies",img:"https://images.unsplash.com/photo-1578768079052-aa76e52ff102?w=500",badge:"HOT"},

{id:29,name:"Veluxe Stacked Jeans - Black",price:105,old:135,cat:"cargos",img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=500",badge:"HOT"},
{id:30,name:"Veluxe Zip Hoodie - Grey",price:98,old:125,cat:"hoodies",img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500",badge:""},
{id:31,name:"Veluxe Dad Cap - Beige",price:26,old:34,cat:"caps",img:"https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=500",badge:""},
{id:32,name:"Veluxe Henley Tee - Charcoal",price:50,old:68,cat:"tees",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500",badge:""},
{id:33,name:"Veluxe Leather Jacket - Noir",price:195,old:250,cat:"jackets",img:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500",badge:"LUXE"},
{id:34,name:"Veluxe Cargo Shorts - Khaki",price:62,old:80,cat:"cargos",img:"https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=500",badge:""},
{id:35,name:"Veluxe Cropped Hoodie - White",price:88,old:110,cat:"hoodies",img:"https://images.unsplash.com/photo-1578768079052-aa76e52ff102?w=500",badge:"NEW"},
{id:36,name:"Veluxe 5-Panel Cap - Black",price:28,old:38,cat:"caps",img:"https://images.unsplash.com/photo-1532453288672-3a27e9be9efd?w=500",badge:""},
{id:37,name:"Veluxe Heavyweight Tee - Forest",price:54,old:72,cat:"tees",img:"https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=500",badge:"BESTSELLER"},
{id:38,name:"Veluxe Track Pants - Black",price:82,old:105,cat:"cargos",img:"https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?w=500",badge:""},
{id:39,name:"Veluxe Bomber Jacket - Olive",price:135,old:175,cat:"jackets",img:"https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=500",badge:"HOT"},
{id:40,name:"Veluxe Waffle Knit - Cream",price:68,old:88,cat:"tees",img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500",badge:"WINTER"}
];
let cart=JSON.parse(localStorage.getItem("veluxe_cart")||"[]");
let activeCat="all";
function renderProducts(){const c=document.getElementById("products");const f=activeCat=="all"?productsData:productsData.filter(p=>p.cat==activeCat);c.innerHTML=f.map(p=>`<div class="card"><div class="card-img"><img src="${p.img}" loading="lazy">${p.badge?`<div class="badge">${p.badge}</div>`:``}</div><div class="card-info"><div class="card-title">${p.name}</div><div class="card-price"><span class="price">$${p.price}</span><span class="old">$${p.old}</span></div><button class="add" onclick="addToCart(${p.id})">Add to Cart</button></div></div>`).join("")}
function addToCart(id){const p=productsData.find(x=>x.id==id);const ex=cart.find(x=>x.id==id);if(ex)ex.qty++;else cart.push({...p,qty:1});saveCart();renderCart();toggleCart(true)}
function saveCart(){localStorage.setItem("veluxe_cart",JSON.stringify(cart));document.getElementById("cartCount").textContent=cart.reduce((s,i)=>s+i.qty,0)}
function renderCart(){const c=document.getElementById("cartItems");if(!cart.length){c.innerHTML=`<div style="padding:40px;text-align:center;color:#888">CART EMPTY</div>`;updateTotal();return}c.innerHTML=cart.map((it,idx)=>`<div class="c-item"><div class="c-img"><img src="${it.img}"></div><div class="c-info"><div class="c-name" style="font-size:11px;font-weight:600;text-transform:uppercase">${it.name}</div><div class="c-bottom" style="display:flex;justify-content:space-between;margin-top:10px"><div class="qty" style="display:flex;gap:8px;border:1px solid #eaeaea;border-radius:20px;padding:2px 6px"><button onclick="changeQty(${idx},-1)" style="width:24px;height:24px;border:0;background:#000;color:#fff;border-radius:50%">-</button><span>${it.qty}</span><button onclick="changeQty(${idx},1)" style="width:24px;height:24px;border:0;background:#000;color:#fff;border-radius:50%">+</button></div><span style="font-weight:700">$${it.price*it.qty}</span></div></div></div>`).join("");updateTotal()}
function changeQty(idx,d){cart[idx].qty+=d;if(cart[idx].qty<=0)cart.splice(idx,1);saveCart();renderCart()}
function updateTotal(){const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);document.getElementById("subtotal").textContent="$"+sub;document.getElementById("total").textContent="$"+(sub+15)}
function toggleCart(f){const d=document.getElementById("cartDrawer");if(f===true){d.classList.add("show");return}if(f===false){d.classList.remove("show");return}d.classList.toggle("show")}
function filterCat(cat,el){activeCat=cat;document.querySelectorAll(".filter").forEach(f=>f.classList.remove("active"));el.classList.add("active");renderProducts();window.scrollTo({top:200,behavior:'smooth'})}
function checkout(){if(!cart.length)return alert("Cart empty");const text=encodeURIComponent(`Hello VELUXE! 👋\nI want to order:\n\n${cart.map(i=>`• ${i.name} x${i.qty} - $${i.price*i.qty}`).join("\n")}\n\nSubtotal: $${cart.reduce((s,i)=>s+i.price*i.qty,0)}\nShipping: $15\nTotal: $${cart.reduce((s,i)=>s+i.price*i.qty,0)+15}`);const waNumber="2347067087764";window.open(`https://wa.me/${waNumber}?text=${text}`,"_blank")}
renderProducts();renderCart();saveCart();
</script>
</body>
</html>
