<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELUXE FAMILY</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Space Grotesk',sans-serif;background:#fff;color:#0a0a0a}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #eaeaea;display:flex;justify-content:space-between;padding:16px 20px;align-items:center}
.logo{font-size:26px;font-weight:700;letter-spacing:5px;cursor:pointer}.h-right{display:flex;gap:10px;align-items:center}
.icon-btn{width:42px;height:42px;border:1px solid #eaeaea;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;cursor:pointer}
.admin-btn{height:42px;padding:0 18px;border-radius:20px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:1px;cursor:pointer}
.admin-btn.hidden{display:none}
.cart-count{position:absolute;top:-5px;right:-5px;background:#000;color:#fff;font-size:10px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{border:1px solid #eaeaea;border-radius:20px;overflow:hidden}.card-img{aspect-ratio:1/1.15;background:#f5f5f5;position:relative}.card-img img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:10px;left:10px;background:#fff;padding:5px 10px;border-radius:20px;font-size:8px;font-weight:700}
.card-info{padding:12px}.card-title{font-size:10px;font-weight:700;text-transform:uppercase;min-height:28px}.stock{font-size:9px;margin-top:5px;font-weight:800}.stock.low{color:#ff3b30}.stock.ok{color:#00b050}.add{margin-top:8px;width:100%;height:40px;border:0;background:#000;color:#fff;border-radius:12px;font-weight:700;font-size:10px;cursor:pointer}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 20px}.filter{white-space:nowrap;padding:11px 18px;border:1px solid #eaeaea;border-radius:30px;background:#fff;font-size:10px;font-weight:700;cursor:pointer}.filter.active{background:#000;color:#fff}
</style>
</head>
<body>
<header><div class="logo" id="secretLogo">VELUXE</div><div class="h-right"><div class="admin-btn hidden" id="adminBtn" onclick="goAdmin()">ADMIN</div><div class="icon-btn" onclick="alert('Cart')">🛒<div id="cartCount" class="cart-count">0</div></div></div></header>

<div style="padding:20px"><h1 style="font-size:36px">VELUXE FAMILY</h1><p id="countText" style="color:#888;font-size:12px"></p></div>
<div class="filters">
<div class="filter active" onclick="filterCat('all',this)">ALL</div>
<div class="filter" onclick="filterCat('mens',this)">MENS</div>
<div class="filter" onclick="filterCat('womens',this)">WOMENS</div>
<div class="filter" onclick="filterCat('baby',this)">BABY</div>
</div>
<div id="products" class="products"></div>

<script>
const ADMIN_PIN="admin123";
const adminBtn=document.getElementById('adminBtn');
function goAdmin(){let p=prompt("Enter PIN:"); if(p===ADMIN_PIN) location.href='admin.html'; else if(p) alert("Wrong PIN");}
(function(){ if(location.search.includes('admin')){ let p=prompt("Admin PIN:"); if(p===ADMIN_PIN){adminBtn.classList.remove('hidden'); alert("Unlocked 🔓");} }})();
let c=0; document.getElementById('secretLogo').addEventListener('click',()=>{c++; if(c>=5){c=0; let p=prompt("Admin PIN:"); if(p===ADMIN_PIN){adminBtn.classList.remove('hidden'); alert("Unlocked 🔓");}} setTimeout(()=>{if(c>0)c--},1000);});

const defaultProducts=[
{id:100,name:"Womens Satin Dress Black",price:78,old:105,cat:"womens",stock:7,img:"https://images.unsplash.com/photo-1515372039744-b8f02a3c67ae?w=600",badge:"WOMENS"},
{id:60,name:"Mens VELUXE Stripe Shirt REAL",price:68,old:90,cat:"mens",stock:15,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600",badge:"MENS REAL"},
{id:52,name:"Baby Onesie Cream Bear",price:25,old:35,cat:"baby",stock:30,img:"https://images.unsplash.com/photo-1522771930-78848d9293e8?w=600",badge:"BABY"}
];
let productsData=JSON.parse(localStorage.getItem("veluxe_custom_products")||"null")||defaultProducts;
let activeCat="all";
function renderProducts(){
document.getElementById("countText").textContent=productsData.length+" PIECES";
let f=activeCat=="all"?productsData:productsData.filter(p=>p.cat==activeCat);
document.getElementById("products").innerHTML=f.map(p=>`<div class="card"><div class="card-img"><img src="${p.img}"><div class="badge">${p.badge}</div></div><div class="card-info"><div class="card-title">${p.name}</div><div class="stock ok">${p.stock} in stock</div><div style="font-weight:800">$${p.price}</div><button class="add">Add to Cart</button></div></div>`).join("");
}
function filterCat(cat,el){activeCat=cat; document.querySelectorAll(".filter").forEach(f=>f.classList.remove("active")); el.classList.add("active"); renderProducts();}
renderProducts();
</script>
</body>
</html>
