<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELUXE - Luxury Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:#fff;color:#0a0a0a}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #eaeaea;display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.logo{font-size:26px;font-weight:700;letter-spacing:5px}
.icon-btn{width:42px;height:42px;border:1px solid #eaeaea;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;cursor:pointer}
.cart-count{position:absolute;top:-5px;right:-5px;background:#000;color:#fff;font-size:10px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.hero{padding:32px 20px 10px}
.hero h1{font-size:48px;line-height:.9;letter-spacing:-1px}
.hero h1 em{font-weight:400;letter-spacing:4px;font-style:normal}
.hero p{color:#888;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-top:10px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 20px;position:sticky;top:65px;background:#fff;z-index:10}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;padding:11px 20px;border:1px solid #eaeaea;border-radius:30px;background:#fff;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase}
.filter.active{background:#000;color:#fff;border-color:#000}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 10px 100px}
.card{border:1px solid #eaeaea;border-radius:20px;overflow:hidden;background:#fff}
.card-img{aspect-ratio:1/1.15;background:#f5f5f5;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:10px;left:10px;background:#fff;padding:5px 12px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:1px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card-info{padding:13px}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;line-height:1.3;min-height:28px}
.card-price{margin-top:7px;display:flex;gap:6px;align-items:center}
.price{font-weight:800;font-size:14px}.old{text-decoration:line-through;color:#888;font-size:11px}
.add{margin-top:13px;width:100%;height:42px;border:0;background:#000;color:#fff;border-radius:12px;font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.cart-drawer{position:fixed;inset:0;z-index:100;display:none}
.cart-drawer.show{display:block}
.cart-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.cart-box{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:400px;background:#fff;display:flex;flex-direction:column}
.cart-head{padding:22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eaeaea;font-weight:800;letter-spacing:2px}
.cart-items{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.c-item{display:flex;gap:12px;border:1px solid #eaeaea;padding:10px;border-radius:16px}
.c-img{width:75px;height:85px;background:#f5f5f5;border-radius:12px;overflow:hidden;flex-shrink:0}
.c-img img{width:100%;height:100%;object-fit:cover}
.cart-foot{padding:20px;border-top:1px solid #eaeaea;background:#fafafa}
.row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;text-transform:uppercase}
.row.total{font-weight:800;font-size:18px;margin-top:12px}
.checkout{width:100%;height:54px;background:#000;color:#fff;border:0;border-radius:14px;font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:14px;cursor:pointer}
@media(min-width:768px){.products{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:78px}}
</style>
</head>

<div id="products" class="products"></div>

<div class="cart-bg"></div>
<div class="cart-box">
<div class="cart-head"><span>CART</span><span onclick="toggleCart()" style="cursor:pointer;font-size:20px">✕</span></div>
<div id="cartItems" class="cart-items"></div>
<div class="cart-foot">
<div class="row"><span>Subtotal</span><span id="subtotal">$0</span></div>
<div class="row"><span>Shipping</span><span>$15</span></div>
<div class="row total"><span>Total</span><span id="total">$15</span></div>
<button class="checkout" onclick="checkout()">Order via WhatsApp</button>
</div>
</div>

let cart=JSON.parse(localStorage.getItem("veluxe59")||"[]");
let activeCat="all";
function renderProducts(){const c=document.getElementById("products");const f=activeCat=="all"?productsData:productsData.filter(p=>p.cat==activeCat);c.innerHTML=f.map(p=>`<div class="card"><div class="card-img"><img src="${p.img}" loading="lazy" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600'">${p.badge?`<div class="badge">${p.badge}</div>`:``}</div><div class="card-info"><div class="card-title">${p.name}</div><div class="card-price"><span class="price">$${p.price}</span><span class="old">$${p.old}</span></div><button class="add" onclick="addToCart(${p.id})">Add to Cart</button></div></div>`).join("")}
function addToCart(id){const p=productsData.find(x=>x.id==id);const ex=cart.find(x=>x.id==id);if(ex)ex.qty++;else cart.push({...p,qty:1});saveCart();renderCart();toggleCart(true)}
function saveCart(){localStorage.setItem("veluxe59",JSON.stringify(cart));document.getElementById("cartCount").textContent=cart.reduce((s,i)=>s+i.qty,0)}
function renderCart(){const c=document.getElementById("cartItems");if(!cart.length){c.innerHTML=`<div style="padding:50px;text-align:center;color:#999">CART EMPTY</div>`;updateTotal();return}c.innerHTML=cart.map((it,idx)=>`<div class="c-item"><div class="c-img"><img src="${it.img}" onerror="this.src='https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600'"></div><div style="flex:1"><div style="font-size:11px;font-weight:700;text-transform:uppercase">${it.name}</div><div style="display:flex;justify-content:space-between;margin-top:12px"><div style="display:flex;gap:8px;align-items:center;border:1px solid #eaeaea;border-radius:20px;padding:3px 8px"><button onclick="changeQty(${idx},-1)" style="width:22px;height:22px;border:0;background:#000;color:#fff;border-radius:50%;cursor:pointer">-</button><span style="font-size:12px">${it.qty}</span><button onclick="changeQty(${idx},1)" style="width:22px;height:22px;border:0;background:#000;color:#fff;border-radius:50%;cursor:pointer">+</button></div><span style="font-weight:800">$${it.price*it.qty}</span></div></div></div>`).join("");updateTotal()}
function changeQty(idx,d){cart[idx].qty+=d;if(cart[idx].qty<=0)cart.splice(idx,1);saveCart();renderCart()}
function updateTotal(){const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);document.getElementById("subtotal").textContent="$"+sub;document.getElementById("total").textContent="$"+(sub+15)}
function toggleCart(f){const d=document.getElementById("cartDrawer");if(f===true){d.classList.add("show");return}if(f===false){d.classList.remove("show");return}d.classList.toggle("show")}
function filterCat(cat,el){activeCat=cat;document.querySelectorAll(".filter").forEach(f=>f.classList.remove("active"));el.classList.add("active");renderProducts()}
function checkout(){if(!cart.length)return alert("Cart empty");const text=encodeURIComponent(`Hello VELUXE! 👋\nI want to order:\n\n${cart.map(i=>`• ${i.name} x${i.qty} - $${i.price*i.qty}`).join("\n")}\n\nSubtotal: $${cart.reduce((s,i)=>s+i.price*i.qty,0)}\nShipping: $15\nTotal: $${cart.reduce((s,i)=>s+i.price*i.qty,0)+15}`);window.open(`https://wa.me/2347067087764?text=${text}`,"_blank")}
renderProducts();renderCart();saveCart();
</script>
