<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELUXE FAMILY - Trusted Store</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Space Grotesk',sans-serif;background:#fff;color:#0a0a0a}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #eaeaea;display:flex;justify-content:space-between;padding:16px 20px;align-items:center}
.logo{font-size:26px;font-weight:700;letter-spacing:5px;cursor:pointer;user-select:none}.h-right{display:flex;gap:10px;align-items:center}
.icon-btn{width:42px;height:42px;border:1px solid #eaeaea;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;cursor:pointer}
.admin-btn{height:42px;padding:0 18px;border-radius:20px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:1px;cursor:pointer}
.admin-btn.hidden{display:none !important}
.cart-count{position:absolute;top:-5px;right:-5px;background:#000;color:#fff;font-size:10px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.hero{padding:28px 20px 10px}.hero h1{font-size:44px;line-height:.9}.hero p{color:#888;font-size:12px;margin-top:10px}
.trust-bar{display:flex;gap:8px;padding:12px 20px;background:#f8f8f8;border-bottom:1px solid #eaeaea;overflow-x:auto}.trust-bar::-webkit-scrollbar{display:none}.trust-item{white-space:nowrap;background:#fff;border:1px solid #eaeaea;border-radius:20px;padding:6px 12px;font-size:9px;font-weight:700;letter-spacing:.5px}
.search-box{margin:16px 20px 0;position:relative}.search-box input{width:100%;height:50px;padding:0 20px 0 45px;border:1px solid #eaeaea;border-radius:30px;background:#fafafa;outline:none}.search-box span{position:absolute;left:16px;top:50%;transform:translateY(-50%)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 20px;position:sticky;top:65px;background:#fff;z-index:10}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;padding:11px 18px;border:1px solid #eaeaea;border-radius:30px;background:#fff;font-size:10px;font-weight:700;cursor:pointer}.filter.active{background:#000;color:#fff}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{border:1px solid #eaeaea;border-radius:20px;overflow:hidden}.card-img{aspect-ratio:1/1.15;background:#f5f5f5;position:relative}.card-img img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:10px;left:10px;background:#fff;padding:5px 10px;border-radius:20px;font-size:8px;font-weight:700}
.card-info{padding:12px}.card-title{font-size:10px;font-weight:700;text-transform:uppercase;min-height:28px}.stock{font-size:9px;margin-top:5px;font-weight:800}.stock.low{color:#ff3b30}.stock.ok{color:#00b050}.add{margin-top:8px;width:100%;height:40px;border:0;background:#000;color:#fff;border-radius:12px;font-weight:700;font-size:10px;cursor:pointer}.add:disabled{background:#e5e5e5}
.size-modal{position:fixed;inset:0;z-index:200;display:none}.size-modal.show{display:flex;align-items:center;justify-content:center}.size-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}.size-box{position:relative;background:#fff;border-radius:20px;padding:24px;width:90%;max-width:360px}.sizes{display:flex;gap:8px;margin-bottom:18px}.size-opt{flex:1;height:44px;border:1px solid #eaeaea;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}.size-opt.active{background:#000;color:#fff}
.cart-drawer{position:fixed;inset:0;z-index:100;display:none}.cart-drawer.show{display:block}.cart-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}.cart-box{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:400px;background:#fff;display:flex;flex-direction:column}.cart-head{padding:22px;display:flex;justify-content:space-between;border-bottom:1px solid #eaeaea;font-weight:800}.cart-items{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.c-item{display:flex;gap:12px;border:1px solid #eaeaea;padding:10px;border-radius:16px}.c-img{width:75px;height:85px;background:#f5f5f5;border-radius:12px;overflow:hidden}.cart-foot{padding:20px;border-top:1px solid #eaeaea;background:#fafafa}.row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px}.row.total{font-weight:800;font-size:18px;margin-top:10px}
.checkout{width:100%;height:54px;background:#000;color:#fff;border:0;border-radius:14px;font-weight:800;font-size:12px;letter-spacing:1px;margin-top:10px;cursor:pointer}.checkout.call{background:#fff;color:#000;border:1px solid #000}.checkout.wa{background:#25D366}
.contact-box{padding:30px 20px;background:#0a0a0a;color:#fff;margin-top:20px}.contact-box h3{font-size:14px;letter-spacing:2px;margin-bottom:14px}.contact-item{display:flex;gap:10px;margin-bottom:12px;font-size:12px;align-items:center}.contact-item a{color:#fff;text-decoration:none}
.wa-float{position:fixed;bottom:90px;right:20px;width:56px;height:56px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:90;cursor:pointer}
.call-float{position:fixed;bottom:20px;right:20px;width:56px;height:56px;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:90;cursor:pointer;color:#fff;border:1px solid #fff}
@media(min-width:768px){.products{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="logo" id="secretLogo">VELUXE</div><div class="h-right"><div class="admin-btn hidden" id="adminBtn" onclick="goAdmin()">ADMIN</div><div class="icon-btn" onclick="toggleCart()">🛒<div id="cartCount" class="cart-count">0</div></div></div></header>
<!-- REST OF YOUR CODE SAME AS BEFORE - TRUST BAR, SEARCH, PRODUCTS etc -->
