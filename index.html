<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELUXE FAMILY - Trusted Store</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Space Grotesk',sans-serif;background:#fff;color:#0a0a0a}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #eaeaea;display:flex;justify-content:space-between;padding:16px 20px;align-items:center}
.logo{font-size:26px;font-weight:700;letter-spacing:5px;cursor:pointer;user-select:none}.h-right{display:flex;gap:10px;align-items:center}
.icon-btn{width:42px;height:42px;border:1px solid #eaeaea;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.cart-count{position:absolute;top:-5px;right:-5px;background:#000;color:#fff;font-size:10px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.hero{padding:28px 20px 10px}.hero h1{font-size:44px;line-height:.9}.hero p{color:#888;font-size:12px;margin-top:10px}
.trust-bar{display:flex;gap:8px;padding:12px 20px;background:#f8f8f8;border-bottom:1px solid #eaeaea;overflow-x:auto}.trust-bar::-webkit-scrollbar{display:none}.trust-item{white-space:nowrap;background:#fff;border:1px solid #eaeaea;border-radius:20px;padding:6px 12px;font-size:9px;font-weight:700;display:flex;align-items:center;gap:5px}
.search-box{margin:16px 20px 0;position:relative}.search-box input{width:100%;height:50px;padding:0 20px 0 45px;border:1px solid #eaeaea;border-radius:30px;background:#fafafa;outline:none}.search-box span{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:flex}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 20px;position:sticky;top:65px;background:#fff;z-index:10}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;padding:11px 18px;border:1px solid #eaeaea;border-radius:30px;background:#fff;font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px}.filter.active{background:#000;color:#fff}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{border:1px solid #eaeaea;border-radius:20px;overflow:hidden}.card-img{aspect-ratio:1/1.15;background:#f5f5f5;position:relative}.card-img img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:10px;left:10px;background:#fff;padding:5px 10px;border-radius:20px;font-size:8px;font-weight:700}
.card-info{padding:12px}.card-title{font-size:10px;font-weight:700;text-transform:uppercase;min-height:28px}.stock{font-size:9px;margin-top:5px;font-weight:800}.stock.low{color:#ff3b30}.stock.ok{color:#00b050}.add{margin-top:8px;width:100%;height:40px;border:0;background:#000;color:#fff;border-radius:12px;font-weight:700;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}.add:disabled{background:#e5e5e5}
.size-modal{position:fixed;inset:0;z-index:200;display:none}.size-modal.show{display:flex;align-items:center;justify-content:center}.size-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}.size-box{position:relative;background:#fff;border-radius:20px;padding:24px;width:90%;max-width:360px}.sizes{display:flex;gap:8px;margin-bottom:18px}.size-opt{flex:1;height:44px;border:1px solid #eaeaea;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}.size-opt.active{background:#000;color:#fff}
.cart-drawer{position:fixed;inset:0;z-index:100;display:none}.cart-drawer.show{display:block}.cart-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}.cart-box{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:400px;background:#fff;display:flex;flex-direction:column}.cart-head{padding:22px;display:flex;justify-content:space-between;border-bottom:1px solid #eaeaea;font-weight:800}.cart-items{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.c-item{display:flex;gap:12px;border:1px solid #eaeaea;padding:10px;border-radius:16px}.c-img{width:75px;height:85px;background:#f5f5f5;border-radius:12px;overflow:hidden}.c-img img{width:100%;height:100%;object-fit:cover}.cart-foot{padding:20px;border-top:1px solid #eaeaea;background:#fafafa}.row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px}.row.total{font-weight:800;font-size:18px;margin-top:10px}
.checkout{width:100%;height:54px;background:#000;color:#fff;border:0;border-radius:14px;font-weight:800;font-size:12px;letter-spacing:1px;margin-top:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}.checkout.call{background:#fff;color:#000;border:1px solid #000}.checkout.wa{background:#25D366}
.contact-box{padding:30px 20px;background:#0a0a0a;color:#fff;margin-top:20px}.contact-box h3{font-size:14px;letter-spacing:2px;margin-bottom:14px}.contact-item{display:flex;gap:10px;margin-bottom:12px;font-size:12px;align-items:center}.contact-item a{color:#fff;text-decoration:none}
.wa-float{position:fixed;bottom:90px;right:20px;width:56px;height:56px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:90;cursor:pointer}
.call-float{position:fixed;bottom:20px;right:20px;width:56px;height:56px;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:90;cursor:pointer;color:#fff;border:1px solid #fff}
@media(min-width:768px){.products{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="logo" id="secretLogo">VELUXE</div><div class="h-right"><div class="icon-btn" onclick="toggleCart()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><div id="cartCount" class="cart-count">0</div></div></div></header>
<div class="hero"><h1>VELUXE<br><em style="font-weight:400;letter-spacing:3px;font-style:normal">FAMILY</em></h1><p id="countText"></p></div>
<div class="trust-bar" id="trustBar"></div>
<div class="search-box"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span><input id="searchInput" type="text" placeholder="Search mens, womens, baby..." oninput="handleSearch(this.value)"></div>
<div class="filters">
<div class="filter active" onclick="filterCat('all',this)">ALL</div>
<div class="filter" onclick="filterCat('mens',this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> MENS</div>
<div class="filter" onclick="filterCat('womens',this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> WOMENS</div>
<div class="filter" onclick="filterCat('baby',this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M9 16c0 0 1.5 2 3 2s3-2 3-2"/></svg> BABY</div>
<div class="filter" onclick="filterCat('shoes',this)">SHOES</div>
<div class="filter" onclick="filterCat('tees',this)">TEES</div>
</div>
<div id="products" class="products"></div>
<div class="contact-box" id="contactBox"></div>
<div id="sizeModal" class="size-modal"><div class="size-bg" onclick="closeSize()"></div><div class="size-box"><div style="font-weight:800;margin-bottom:14px;font-size:12px">SELECT SIZE</div><div class="sizes"><div class="size-opt" onclick="selectSize('S',this)">S</div><div class="size-opt" onclick="selectSize('M',this)">M</div><div class="size-opt active" onclick="selectSize('L',this)">L</div><div class="size-opt" onclick="selectSize('XL',this)">XL</div></div><button class="add" onclick="confirmAdd()">CONFIRM</button></div></div>
<div class="wa-float" id="waFloat"><svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M19.05 4.94A9.82 9.82 0 0 0 12.03 2a9.85 9.85 0 0 0-8.49 14.86L2 22l5.28-1.38A9.82 9.82 0 0 0 12.03 22a9.85 9.85 0 0 0 9.85-9.85 9.78 9.78 0 0 0-2.83-6.21z"/></svg></div>
<div class="call-float" id="callFloat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/></svg></div>
<div id="cartDrawer" class="cart-drawer"><div class="cart-bg" onclick="toggleCart()"></div><div class="cart-box"><div class="cart-head"><span>CART</span><span onclick="toggleCart()" style="cursor:pointer;font-size:22px">X</span></div><div id="cartItems" class="cart-items"></div><div class="cart-foot"><div class="row"><span>Subtotal</span><span id="subtotal">$0</span></div><div class="row total"><span>Total + Shipping</span><span id="total">$0</span></div><button class="checkout wa" id="waCheckout">ORDER VIA WHATSAPP</button><button class="checkout call" id="callCheckout">CALL TO ORDER</button><div style="font-size:9px;color:#888;text-align:center;margin-top:10px" id="trustNote"></div></div></div></div>
<script>
const ADMIN_PIN="admin123";
function unlockAdmin(){let p=prompt("Enter Admin PIN:"); if(p===ADMIN_PIN) location.href='admin.html'; else if(p!==null) alert("Wrong PIN!");}
if(location.search.includes('admin')) unlockAdmin();
let c=0;document.getElementById('secretLogo').addEventListener('click',()=>{c++; if(c>=5){c=0; unlockAdmin();} setTimeout(()=>{if(c>0)c--;},800);});
const STORE_PHONE="2347067087764"; const STORE_DISPLAY="0706 708 7764"; const STORE_EMAIL="veluxe820@gmail.com"; const STORE_LOCATION="Ibadan, Oyo State - We dey deliver everywhere for Nigeria";
document.getElementById('trustBar').innerHTML=`<div class="trust-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> VERIFIED SELLER</div><div class="trust-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07"/></svg> CALL: ${STORE_DISPLAY}</div><div class="trust-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 6v5h-7V8z"/></svg> DELIVERY SAME DAY</div><div class="trust-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7"/></svg> WHATSAPP 24/7</div>`;
document.getElementById('contactBox').innerHTML=`<h3>CONTACT US</h3><div class="contact-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2"/></svg> <a href="tel:+${STORE_PHONE}">${STORE_DISPLAY}</a></div><div class="contact-item"><a href="https://wa.me/${STORE_PHONE}">${STORE_DISPLAY} WhatsApp</a></div><div class="contact-item">${STORE_LOCATION}</div><div class="contact-item">${STORE_EMAIL}</div>`;
document.getElementById('waFloat').onclick=()=>window.open(`https://wa.me/${STORE_PHONE}`,'_blank');
document.getElementById('callFloat').onclick=()=>window.location.href=`tel:+${STORE_PHONE}`;
const defaultProducts=[{id:100,name:"Womens Satin Dress Black",price:78,old:105,cat:"womens",stock:7,img:"https://images.unsplash.com/photo-1515372039744-b8f02a3c67ae?w=600",badge:"WOMENS"},{id:60,name:"Mens VELUXE Stripe Shirt REAL",price:68,old:90,cat:"mens",stock:15,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600",badge:"MENS REAL"},{id:52,name:"Baby Onesie Cream Bear",price:25,old:35,cat:"baby",stock:30,img:"https://images.unsplash.com/photo-1522771930-78848d9293e8?w=600",badge:"BABY"}];
let productsData=JSON.parse(localStorage.getItem("veluxe_custom_products")||"null")||defaultProducts;
let cart=JSON.parse(localStorage.getItem("veluxe59")||"[]");
let activeCat="all"; let searchQ=""; let pending=null; let selSize="L";
function handleSearch(q){searchQ=q.toLowerCase();renderProducts()}
function renderProducts(){document.getElementById("countText").textContent=productsData.length+" PIECES - CALL "+STORE_DISPLAY;let f=activeCat=="all"?productsData:productsData.filter(p=>p.cat==activeCat);if(searchQ)f=f.filter(p=>p.name.toLowerCase().includes(searchQ));document.getElementById("products").innerHTML=f.map(p=>`<div class="card"><div class="card-img"><img src="${p.img}"><div class="badge">${p.badge}</div></div><div class="card-info"><div class="card-title">${p.name}</div><div class="stock ok">${p.stock} in stock</div><div>$${p.price}</div><button class="add" onclick="openSize(${p.id})">Add to Cart</button></div></div>`).join("")}
function openSize(id){pending=productsData.find(x=>x.id==id);document.getElementById("sizeModal").classList.add("show")}
function closeSize(){document.getElementById("sizeModal").classList.remove("show")}
function selectSize(s,el){selSize=s;document.querySelectorAll(".size-opt").forEach(o=>o.classList.remove("active"));el.classList.add("active")}
function confirmAdd(){const p=pending;const nid=p.id+"-"+selSize;const ex=cart.find(x=>x.id==nid);if(ex)ex.qty++;else cart.push({...p,id:nid,name:p.name+" ("+selSize+")",qty:1});localStorage.setItem("veluxe59",JSON.stringify(cart));document.getElementById("cartCount").textContent=cart.reduce((s,i)=>s+i.qty,0);closeSize();toggleCart(true);renderCart()}
function renderCart(){const c=document.getElementById("cartItems");if(!cart.length){c.innerHTML="CART EMPTY";return}c.innerHTML=cart.map((it,i)=>`<div class="c-item"><div>${it.name} x${it.qty}</div><button onclick="cart.splice(${i},1);localStorage.setItem('veluxe59',JSON.stringify(cart));renderCart()">X</button></div>`).join("")}
function toggleCart(f){const d=document.getElementById("cartDrawer");if(f===true){d.classList.add("show");return}if(f===false){d.classList.remove("show");return}d.classList.toggle("show")}
function filterCat(cat,el){activeCat=cat;document.querySelectorAll(".filter").forEach(f=>f.classList.remove("active"));el.classList.add("active");renderProducts()}
function checkoutWA(){const text=encodeURIComponent("Hello VELUXE! I want: "+cart.map(i=>i.name+" x"+i.qty).join(", "));window.open(`https://wa.me/${STORE_PHONE}?text=${text}`,"_blank")}
renderProducts();
</script>
</body>
</html>
